; ---------------------------------------------------------------------------
; PlatformIO project for the ESP32-CAM robot.
;
; The sketch stays a plain Arduino sketch at the repository root --
; wdi_esp32_cam_robot_m1/wdi_esp32_cam_robot_m1.ino -- so it still opens in
; the Arduino IDE exactly as readme.md describes. src_dir points PlatformIO
; at that same file instead of the usual src/ subdirectory.
; ---------------------------------------------------------------------------
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.11.0
board = esp32cam
framework = arduino

; src_dir is the project root, so the default source filter would also walk
; .pio/ and treat the build tree as its own source -- which destroys the build
; directory mid-compile. Keep everything else, exclude the generated folders.
build_src_filter = +<*> -<.pio/> -<.git/> -<export/>

; readme.md asks for an OTA-capable partition scheme; min_spiffs.csv is the
; "Minimal SPIFFS (1.9MB APP with OTA / 190KB SPIFFS)" entry of the Arduino
; IDE Partition Scheme menu. The board default (huge_app) has no OTA slot,
; and the browser uploader in the Debug sidebar would fail at Update.begin().
board_build.partitions = min_spiffs.csv

; High camera resolutions need PSRAM.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; This carrier has no auto-reset. readme.md: drop to 115200 when a faster
; upload connects and then dies after the baud switch.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
